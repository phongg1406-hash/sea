<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-labelledby="title desc">
<title id="title">Sunlit Shore vertical scroll map — continuous coastal journey</title>
<desc id="desc">Map of eight main portfolio sections in a continuous vertical coastal scroll journey along Vietnam's coastline.</desc>
<defs>
<linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#00BCCD"/>
<stop offset="100%" stop-color="#87967E"/>
</linearGradient>
<linearGradient id="sandGradient" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#FFF0CB"/>
<stop offset="100%" stop-color="#FFFDF4"/>
</linearGradient>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
<path d="M0,0 L0,10 L10,5 z" fill="#6fd6da"/>
</marker>
</defs>
<rect width="900" height="1200" rx="24" fill="#f6f2e7"/>
<text x="45" y="65" font-family="Arial" font-size="28" font-weight="900" fill="#173d43">SUNLIT SHORE / VERTICAL SCROLL MAP</text>
<text x="47" y="95" font-family="monospace" font-size="14" fill="#5a6965">CONTINUOUS COASTAL JOURNEY · Vertical Navigation · Eight Destinations</text>
<g transform="translate(45 125)">
<!-- Background water gradient -->
<rect width="810" height="1050" fill="url(#waterGradient)"/>
<!-- Sand mask (left side, varying width) -->
<clipPath id="sandMask">
<path d="M0,0 L150,100 L180,250 L120,400 L90,550 L70,700 L100,850 L180,950 L210,1050 L810,1050 L810,0 Z"/>
</clipPath>
<rect width="810" height="1050" fill="url(#sandGradient)" clip-path="url(#sandMask)"/>
<!-- Coastline boundary -->
<path d="M0,0 L150,100 L180,250 L120,400 L90,550 L70,700 L100,850 L180,950 L210,1050"
      fill="none" stroke="#fffdf4" stroke-width="3"/>
<!-- Section markers and labels -->
<g font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#164d55">
<!-- Section 1: Trà Cổ / Home -->
<rect x="405" y="30" width="180" height="40" rx="8" fill="#fffdf4" stroke="#24515b" stroke-width="2"/>
<text x="495" y="55">01 · TRÀ CỔ / HOME</text>
<text x="495" y="75" font-size="14" font-weight="normal">Introduction, water wake</text>
<!-- Section 2: Hạ Long / Projects -->
<rect x="405" y="160" width="180" height="40" rx="8" fill="#fffdf4" stroke="#24515b" stroke-width="2"/>
<text x="495" y="185">02 · HẠ LONG / PROJECTS</text>
<text x="495" y="205" font-size="14" font-weight="normal">Featured postcard projects</text>
<!-- Section 3: Lăng Cô / About Me -->
<rect x="405" y="290" width="180" height="40" rx="8" fill="#fffdf4" stroke="#24515b" stroke-width="2"/>
<text x="495" y="315">03 · LĂNG CÔ / ABOUT ME</text>
<text x="495" y="335" font-size="14" font-weight="normal">Editorial profile & personal journal</text>
<!-- Section 4: Đà Nẵng / Skills -->
<rect x="405" y="420" width="180" height="40" rx="8" fill="#fffdf4" stroke="#24515b" stroke-width="2"/>
<text x="495" y="445">04 · ĐÀ NẴNG / SKILLS</text>
<text x="495" y="465" font-size="14" font-weight="normal">Bento Cards + Floating Skill Net</text>
<!-- Section 5: Quy Nhơn / Resume -->
<rect x="405" y="550" width="180" height="40" rx="8" fill="#fffdf4" stroke="#24515b" stroke-width="2"/>
<text x="495" y="575">05 · QUY NHƠN / RESUME</text>
<text x="495" y="595" font-size="14" font-weight="normal">Editorial Timeline + Compact Cards</text>
<!-- Section 6: Nha Trang / Playground -->
<rect x="405" y="680" width="180" height="40" rx="8" fill="#fffdf4" stroke="#24515b" stroke-width="2"/>
<text x="495" y="705">06 · NHA TRANG / PLAYGROUND</text>
<text x="495" y="725" font-size="14" font-weight="normal">Interactive Lab Cards + Coastal Decorations</text>
<!-- Section 7: Mũi Né / Project Archive -->
<rect x="405" y="810" width="180" height="40" rx="8" fill="#fffdf4" stroke="#24515b" stroke-width="2"/>
<text x="495" y="835">07 · MŨI NÉ / PROJECT ARCHIVE</text>
<text x="495" y="855" font-size="14" font-weight="normal">Coastal Project Library</text>
<!-- Section 8: Mũi Cà Mau / Contact -->
<rect x="405" y="940" width="180" height="40" rx="8" fill="#fffdf4" stroke="#24515b" stroke-width="2"/>
<text x="495" y="965">08 · MŨI CÀ MAU / CONTACT</text>
<text x="495" y="985" font-size="14" font-weight="normal">Open Invitation + Thank You</text>
</g>
<!-- Scroll indicators -->
<g font-family="monospace" font-size="14" fill="#284c50">
<text x="40" y="525">▼</text>
<text x="770" y="525">▼</text>
<text x="405" y="515">Natural vertical scroll</text>
</g>
<!-- Discovery flow indicator (Vũng Tàu Easter Egg) -->
<path d="M700,980 C720,900 750,850 750,780"
      fill="none" stroke="#ffb950" stroke-width="2" stroke-dasharray="5,5"/>
<circle cx="750" cy="780" r="8" fill="#ffb950"/>
<text x="760" y="785" font-size="12" fill="#163f45">Vũng Tàu Discovery</text>
</g>
</g>
<text x="45" y="1180" font-family="monospace" font-size="14" fill="#284c50">
Interaction: Natural vertical scrolling · Anchor navigation · Geographic Shore Map
</text>
</svg>