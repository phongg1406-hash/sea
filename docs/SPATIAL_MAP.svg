<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1150 1150" width="1150" height="1150" role="img" aria-labelledby="title desc">
<title id="title">Sunlit Shore spatial map — desktop canvas</title>
<desc id="desc">Map of six main portfolio regions in a two-dimensional sea and sand world. Navigation follows a zig-zag reading route through the world.</desc>
<defs><linearGradient id="water" x2="1" y2="1"><stop stop-color="#52cdd7"/><stop offset="1" stop-color="#a8e9dd"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#5caea8" opacity=".2"/></pattern><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#244d52" stroke-width="1.3"/></marker></defs>
<rect width="1150" height="1150" rx="24" fill="#f6f2e7"/>
<text x="42" y="68" font-family="Arial" font-size="34" font-weight="900" fill="#173d43">SUNLIT SHORE / SPATIAL MAP</text><text x="44" y="97" font-family="monospace" font-size="15" fill="#5a6965">WORLD 2500 × 2300 logical px · Desktop mode · Not an infinite unbounded world</text>
<g transform="translate(42 130) scale(.414)">
  <rect width="2500" height="2300" fill="url(#water)"/>
  <path d="M1480,-40 C1345,198 1536,267 1424,500 C1304,744 981,750 998,1062 C1024,1389 739,1483 824,1743 C936,2043 720,2124 796,2360 L2550,2360 L2550,-40 Z" fill="#fff0cb"/>
  <path d="M1480,-40 C1345,198 1536,267 1424,500 C1304,744 981,750 998,1062 C1024,1389 739,1483 824,1743 C936,2043 720,2124 796,2360" fill="none" stroke="#fffdf4" stroke-width="23"/>
  <rect width="2500" height="2300" fill="url(#dots)"/>
  <path d="M670 490 L1870 540 L700 1360 L1875 1350 L690 2010 L1900 1995" stroke="#244d52" stroke-width="10" stroke-dasharray="19 23" fill="none" marker-end="url(#arr)" opacity=".38"/>
  <g font-family="Arial" font-weight="800" font-size="48" text-anchor="middle" fill="#164d55">
  <rect x="155" y="235" width="1030" height="555" rx="17" fill="#eaffef" fill-opacity=".82" stroke="#24515b" stroke-width="5"/><text x="670" y="475">01 · OCEAN HERO</text><text x="670" y="536" font-size="30" font-weight="400">Interactive Water Wake</text>
  <rect x="1425" y="177" width="900" height="650" rx="17" fill="#fffdfa" fill-opacity=".88" stroke="#745e47" stroke-width="5"/><text x="1870" y="480">02 · SELECTED WORK</text><text x="1870" y="540" font-size="30" font-weight="400">Postcards + Minimal Cards</text>
  <rect x="220" y="1005" width="980" height="690" rx="17" fill="#eaffef" fill-opacity=".9" stroke="#24515b" stroke-width="5"/><text x="700" y="1335">03 · PLAYGROUND</text><text x="700" y="1390" font-size="30" font-weight="400">Draggable local modules</text>
  <rect x="1470" y="1040" width="820" height="650" rx="17" fill="#fffdfa" fill-opacity=".88" stroke="#745e47" stroke-width="5"/><text x="1875" y="1345">04 · ARCHIVE</text><text x="1875" y="1400" font-size="30" font-weight="400">Grid / List</text>
  <rect x="180" y="1800" width="1050" height="420" rx="17" fill="#eaffef" fill-opacity=".85" stroke="#24515b" stroke-width="5"/><text x="690" y="2010">05 · ABOUT</text><text x="690" y="2068" font-size="30" font-weight="400">Editorial + Bento</text>
  <rect x="1480" y="1765" width="860" height="435" rx="17" fill="#fffdfa" fill-opacity=".9" stroke="#745e47" stroke-width="5"/><text x="1900" y="1978">06 · CONTACT</text><text x="1900" y="2035" font-size="30" font-weight="400">Links / Closing</text>
  </g>
</g>
<text x="45" y="1100" font-family="monospace" font-size="17" fill="#284c50">Interaction: drag open space to pan · wheel to advance narrative · nav/map for direct travel</text>
</svg>
